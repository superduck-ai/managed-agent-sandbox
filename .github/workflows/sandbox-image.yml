name: Sandbox base image

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "justfile"
      - "versions.env"
      - "image/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/sandbox-image.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified images and multi-architecture tag to GHCR"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sandbox-base-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Source and Dockerfile contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      buildable: ${{ steps.matrix.outputs.buildable }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Run the host-side test suite
        run: ./tests/run-tests.sh

      - name: Verify pinned source and version consistency for every architecture
        run: ./scripts/sandbox-image.sh verify-source --all

      - name: Check the Dockerfile for every architecture
        shell: bash
        run: |
          set -euo pipefail
          for arch in $(./scripts/sandbox-image.sh architectures); do
            echo "::group::buildx check linux/$arch"
            ./scripts/sandbox-image.sh --arch "$arch" check
            echo "::endgroup::"
          done

      # The build matrix comes from versions.env, so an architecture is never
      # listed here and forgotten there. Runner labels stay in the workflow
      # because they are a CI fact, not an image contract fact.
      - name: Derive the build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          buildable="$(./scripts/sandbox-image.sh buildable-architectures | tr '\n' ' ')"
          entries=""
          for arch in $buildable; do
            case "$arch" in
              amd64) runner=ubuntu-latest ;;
              arm64) runner=ubuntu-24.04-arm ;;
              *) echo "no runner label is mapped for linux/$arch" >&2; exit 1 ;;
            esac
            entries="$entries{\"arch\":\"$arch\",\"runner\":\"$runner\"},"
          done
          [[ -n "$entries" ]] || { echo "no architecture is currently buildable" >&2; exit 1; }
          matrix="{\"include\":[${entries%,}]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "buildable=$buildable" >> "$GITHUB_OUTPUT"
          {
            echo "### Build matrix"
            echo
            echo "Declared: $(./scripts/sandbox-image.sh architectures | tr '\n' ' ')"
            echo
            echo "Buildable now: $buildable"
          } >> "$GITHUB_STEP_SUMMARY"

  build-test-publish:
    name: Build and verify linux/${{ matrix.arch }}
    needs: source-contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source-contract.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    env:
      SANDBOX_ARCH: ${{ matrix.arch }}
      IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ matrix.arch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Each architecture builds and runs its own contract on a native runner.
      # The contract executes real Cargo, Bundler, and package-manager probes,
      # which emulation would make unusably slow and less faithful.
      - name: Build the image into the local daemon
        env:
          SANDBOX_IMAGE_TAG: ${{ env.IMAGE_REF }}
          SANDBOX_BUILDX_CACHE_FROM: type=gha,scope=sandbox-base-${{ matrix.arch }}
          SANDBOX_BUILDX_CACHE_TO: type=gha,scope=sandbox-base-${{ matrix.arch }},mode=max
        run: ./scripts/sandbox-image.sh build

      - name: Enforce platform, size, and runtime contracts
        run: ./scripts/sandbox-image.sh test-image "$IMAGE_REF"

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the exact verified image and record its identity
        id: identity
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          local_image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          local_descriptor_digest="$(docker image inspect "$IMAGE_REF" | jq -r '.[0].Descriptor.digest // empty')"
          [[ "$local_image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "tested local image ID is invalid" >&2; exit 1; }
          docker push "$IMAGE_REF"
          published_raw="$(docker buildx imagetools inspect --raw "$IMAGE_REF")"
          jq -e . <<<"$published_raw" >/dev/null
          digest="$(docker buildx imagetools inspect "$IMAGE_REF" | awk '$1 == "Digest:" { print $2; exit }')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "published digest is missing or invalid" >&2; exit 1; }

          if jq -e '(.manifests? | type) == "array"' <<<"$published_raw" >/dev/null; then
            platform_digest="$(
              jq -r --arg arch "${{ matrix.arch }}" '
                [.manifests[] | select(
                  .platform.os == "linux" and .platform.architecture == $arch
                )] | if length == 1 then .[0].digest else empty end
              ' <<<"$published_raw"
            )"
          else
            platform_digest="$digest"
          fi
          [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "published artifact has no unique linux/${{ matrix.arch }} manifest" >&2
            exit 1
          }

          immutable_ref="${IMAGE_REF%:*}@$platform_digest"
          platform_raw="$(docker buildx imagetools inspect --raw "$immutable_ref")"
          published_config_digest="$(jq -r '.config.digest // empty' <<<"$platform_raw")"
          platform_image="$(docker buildx imagetools inspect --format '{{json .Image}}' "$immutable_ref")"
          [[ "$(jq -r '.os // .OS // empty' <<<"$platform_image")" == linux ]]
          [[ "$(jq -r '.architecture // .Architecture // empty' <<<"$platform_image")" == "${{ matrix.arch }}" ]]

          # An OCI index is identified by its registry descriptor digest. A classic
          # image (or its selected index child) is identified by its config digest.
          if [[ "$digest" != "$local_descriptor_digest" && "$published_config_digest" != "$local_image_id" ]]; then
            echo "published artifact does not match tested descriptor $local_descriptor_digest or config $local_image_id" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          source_file="$RUNNER_TEMP/manifest-source-${{ matrix.arch }}.txt"
          printf '%s=%s\n' "${{ matrix.arch }}" "$immutable_ref" > "$source_file"
          echo "source-file=$source_file" >> "$GITHUB_OUTPUT"
          echo "Published verified linux/${{ matrix.arch }} identity: $immutable_ref (local identity $local_image_id)" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve the immutable verified manifest source
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manifest-source-${{ matrix.arch }}
          path: ${{ steps.identity.outputs.source-file }}
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish the multi-architecture tag
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs:
      - source-contract
      - build-test-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      INDEX_REF: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore immutable verified manifest sources
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: manifest-source-*
          path: ${{ runner.temp }}/manifest-sources
          merge-multiple: true

      # Composes an OCI index over the per-architecture tags that each passed the
      # full runtime contract, then proves the index carries exactly the expected
      # platforms and references exactly those verified manifests.
      - name: Compose and verify the OCI index
        shell: bash
        run: |
          set -euo pipefail
          refs=()
          for source_file in "$RUNNER_TEMP"/manifest-sources/manifest-source-*.txt; do
            [[ -f "$source_file" ]] || { echo "no verified manifest sources were restored" >&2; exit 1; }
            while IFS= read -r source_ref; do
              [[ -n "$source_ref" ]] && refs+=("$source_ref")
            done < "$source_file"
          done
          ./scripts/sandbox-image.sh publish-manifest "$INDEX_REF" "${refs[@]}"
          index_digest="$(docker buildx imagetools inspect "$INDEX_REF" | awk '$1 == "Digest:" { print $2; exit }')"
          echo "Published multi-architecture identity: $INDEX_REF@$index_digest" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$INDEX_REF" >> "$GITHUB_STEP_SUMMARY"

      # Deliberately no E2B Template promotion step. Deployment is a separate,
      # explicitly authorized operation that consumes the recorded digest.
